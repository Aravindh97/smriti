# Local stack, published on 127.0.0.1 only. Set POSTGRES_PASSWORD in .env.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: smriti
      POSTGRES_DB: smriti
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  temporal:
    image: temporalio/temporal:1.4.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports: ["127.0.0.1:7233:7233", "127.0.0.1:8233:8233"]
    volumes: [temporal:/data]
volumes: {pgdata: {}, temporal: {}}
