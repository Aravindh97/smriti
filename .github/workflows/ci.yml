name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: smriti, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: smriti}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U smriti" --health-interval 5s
    env:
      DATABASE_URL: postgres://smriti:ci-only-password@localhost:5432/smriti?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.26"}
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test -race -tags integration ./internal/store
      - run: go run ./cmd/smriti eval
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.26"}
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm, cache-dependency-path: web/package-lock.json}
      - name: TypeScript types match the Go structs
        if: hashFiles('cmd/tsgen/main.go') != ''
        run: go run ./cmd/tsgen && git diff --exit-code web/src/types.gen.ts
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: ./web/build.sh dist
